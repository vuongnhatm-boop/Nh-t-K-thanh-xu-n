    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: rgba(148, 163, 184, 0.15);
            --primary: #f43f5e;
            --accent: #38bdf8;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(244, 63, 94, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* HEADER */
        header.top-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand-title {
            font-size: 1.35em;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title span {
            color: var(--primary);
        }

        .stats-badge {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.82em;
            font-weight: 600;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 9px 18px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.88em;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.35);
        }
        .btn-primary:hover {
            background: #e11d48;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--card-border);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }
        .btn-success:hover {
            background: #059669;
        }

        /* FILTER & SEARCH BAR */
        .filter-bar {
            max-width: 1360px;
            margin: 20px auto 0;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
        }

        .filter-tabs {
            display: flex;
            gap: 6px;
            background: rgba(30, 41, 59, 0.6);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .filter-tab {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 6px 14px;
            border-radius: 7px;
            font-size: 0.82em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tab.active {
            background: var(--primary);
            color: white;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 6px 14px;
            gap: 8px;
            min-width: 280px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-family: inherit;
            font-size: 0.88em;
            width: 100%;
        }

        /* GRID */
        .gallery-container {
            max-width: 1360px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
        }

        .photo-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            transition: all 0.25s ease;
            position: relative;
        }

        .photo-card:hover {
            transform: translateY(-4px);
            border-color: rgba(244, 63, 94, 0.4);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        .photo-card.assigned {
            border-color: rgba(16, 185, 129, 0.5);
            background: linear-gradient(180deg, rgba(16, 185, 129, 0.05) 0%, var(--card-bg) 100%);
        }

        .card-number-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 5;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            color: white;
            font-size: 0.76em;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .card-img-wrap {
            position: relative;
            width: 100%;
            height: 240px;
            background: #09090b;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card-img-wrap:hover img {
            transform: scale(1.05);
        }

        .card-zoom-hint {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.65);
            color: #fff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.72em;
            pointer-events: none;
            opacity: 0.85;
        }

        .card-body {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
        }

        .file-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78em;
            color: var(--text-muted);
        }

        .filename-title {
            font-weight: 700;
            font-size: 0.95em;
            color: var(--text-main);
            word-break: break-all;
            margin-bottom: 2px;
        }

        .assign-select-wrap {
            margin-top: 4px;
        }

        .assign-label {
            font-size: 0.76em;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 4px;
            display: block;
        }

        .select-teacher {
            width: 100%;
            background: #09090b;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 9px 12px;
            font-family: inherit;
            font-size: 0.85em;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .select-teacher:focus {
            border-color: var(--accent);
        }

        .select-teacher option {
            background: #18181b;
            color: white;
            padding: 8px;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78em;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .status-chip.chip-pending {
            background: rgba(244, 63, 94, 0.12);
            color: var(--primary);
        }
        .status-chip.chip-done {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        /* MODAL LIGHTBOX PHÓNG TO */
        .lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: zoom-out;
        }

        .lightbox-content {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            object-fit: contain;
            cursor: default;
        }

        .lightbox-caption {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9em;
            color: white;
            font-weight: 600;
        }

        /* MODAL EXPORT JSON */
        .export-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .export-card {
            background: #1e293b;
            border: 1px solid var(--card-border);
            border-radius: 18px;
            max-width: 650px;
            width: 100%;
            padding: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .export-textarea {
            width: 100%;
            height: 260px;
            background: #09090b;
            color: #38bdf8;
            font-family: monospace;
            font-size: 0.86em;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            outline: none;
            margin: 14px 0;
            resize: none;
        }
    </style>
</head>

        <div class="brand-title">
            <span>📷</span> Sắp Xếp Ảnh Thầy Cô

        <div class="action-group">
            <button type="button" class="btn btn-secondary" id="btnExportList">

            </button>

            <a href="./index.html" target="_blank" class="btn btn-secondary">

        <div class="filter-tabs">

        <div class="search-box">

    <!-- GALLERY CONTAINER -->
    <div class="gallery-container">
        <div class="gallery-grid" id="galleryGrid">

        </div>
    </div>

    <!-- LIGHTBOX MODAL -->
    <div class="lightbox-modal" id="lightboxModal">
        <img class="lightbox-content" id="lightboxImg" src="" alt="Phóng to ảnh">
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>

    <!-- EXPORT MODAL -->
    <div class="export-modal" id="exportModal">
        <div class="export-card">
            <h3 style="margin-bottom: 8px;">Danh Sách Ghép Ảnh Thầy Cô</h3>
            <p style="font-size: 0.85em; color: var(--text-muted);">Bạn có thể sao chép văn bản bên dưới và gửi trực tiếp vào ô chat để Antigravity tự động cập nhật vào mã nguồn nhé!</p>
            <textarea class="export-textarea" id="exportTextarea" readonly></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" class="btn btn-secondary" id="btnCloseExport">Đóng</button>
                <button type="button" class="btn btn-primary" id="btnCopyExport">Sao Chép Vào Clipboard</button>
            </div>
        </div>
    </div>

        {

                "roleTag": "Thầy Chủ Nhiệm 11C1 • Nhạc Sĩ Thanh Xuân",
                "quote": "Tiếng đàn ngân vang trong các đêm hội, linh hồn của các chương trình văn nghệ và người cha chung ấm áp của 11C1.",
                "bg": "#faf5ff",
                "border": "#a855f7",
                "tagBg": "#f3e8ff",
                "tagColor": "#7e22ce",
                "avatarColor": "#8b5cf6",
                "iconSvg": "<path d=\"M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z\"/>"

        // Load existing mapping from localStorage if any
        let photoMapping = {};
        try {
            const saved = localStorage.getItem('teacher_photo_mapping_v1');
            if (saved) photoMapping = JSON.parse(saved);
        } catch(e) {}

        // Pre-fill guesses if not already set
        PHOTOS.forEach(p => {
            if (!photoMapping[p.filename] && p.guess_id) {
                photoMapping[p.filename] = p.guess_id;
            }
        });

        const galleryGrid = document.getElementById('galleryGrid');
        const statsBadge = document.getElementById('statsBadge');
        let currentFilter = 'all';
        let searchQuery = '';

        function updateStats() {
            const total = PHOTOS.length;
            const assignedCount = Object.values(photoMapping).filter(Boolean).length;
            if (statsBadge) {
                statsBadge.textContent = `${assignedCount}/${total} ảnh đã gán (${total - assignedCount} chưa gán)`;
            }
        }

        function renderGallery() {
            galleryGrid.innerHTML = '';
            
            const filtered = PHOTOS.filter(p => {
                const isAssigned = Boolean(photoMapping[p.filename]);
                if (currentFilter === 'assigned' && !isAssigned) return false;
                if (currentFilter === 'unassigned' && isAssigned) return false;

                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    const teacherName = (TEACHERS.find(t => t.id === photoMapping[p.filename]) || {}).name || '';
                    if (!p.filename.toLowerCase().includes(q) && !teacherName.toLowerCase().includes(q)) {
                        return false;
                    }
                }
                return true;
            });

            if (filtered.length === 0) {
                galleryGrid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-muted);">
                        <p style="font-size: 1.1em; margin-bottom: 6px;">Không tìm thấy ảnh phù hợp với bộ lọc.</p>
                        <p style="font-size: 0.85em;">Thử đổi từ khóa tìm kiếm hoặc bấm tab "Tất Cả".</p>
                    </div>
                `;
                return;
            }

            filtered.forEach((p, idx) => {
                const assignedTeacherId = photoMapping[p.filename] || '';
                const card = document.createElement('div');
                card.className = 'photo-card' + (assignedTeacherId ? ' assigned' : '');

                // Dropdown options
                let optionsHtml = '<option value="">-- Chưa gán Thầy/Cô --</option>';
                optionsHtml += '<option value="__group__">Ảnh tập thể / Kỷ niệm chung</option>';
                optionsHtml += '<option value="__skip__">Bỏ qua / Không dùng</option>';
                optionsHtml += '<optgroup label="Danh Sách 38 Thầy Cô">';

                TEACHERS.forEach(t => {
                    const sel = (t.id === assignedTeacherId) ? 'selected' : '';
                    optionsHtml += `<option value="${t.id}" ${sel}>${t.name} (${t.subject || t.deptName})</option>`;
                });
                optionsHtml += '</optgroup>';

                card.innerHTML = `
                    <div class="card-number-badge">#${idx + 1}</div>
                    <div class="card-img-wrap" data-src="${p.path}" data-name="${p.filename}">
                        <img src="${p.path}" alt="${p.filename}" loading="lazy">
                        <span class="card-zoom-hint">🔍 Phóng to</span>
                    </div>
                    <div class="card-body">
                        <div>
                            <div class="filename-title">${p.filename}</div>
                            <div class="file-meta">
                                <span>${p.width} × ${p.height} px</span>
                                <span>${p.size_kb} KB</span>
                            </div>
                        </div>

                        <div class="assign-select-wrap">
                            <label class="assign-label">Gán vào Thầy / Cô:</label>
                            <select class="select-teacher" data-file="${p.filename}">
                                ${optionsHtml}
                            </select>
                        </div>
                    </div>
                `;

                // Select change
                const selEl = card.querySelector('.select-teacher');
                selEl.addEventListener('change', (e) => {
                    const val = e.target.value;
                    photoMapping[p.filename] = val;
                    localStorage.setItem('teacher_photo_mapping_v1', JSON.stringify(photoMapping));
                    card.classList.toggle('assigned', Boolean(val));
                    updateStats();
                });

                // Lightbox
                const imgWrap = card.querySelector('.card-img-wrap');
                imgWrap.addEventListener('click', () => {
                    openLightbox(p.path, `${p.filename} (${p.width}×${p.height} px)`);
                });

                galleryGrid.appendChild(card);
            });

            updateStats();
        }

        // Lightbox
        const lightboxModal = document.getElementById('lightboxModal');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxCaption = document.getElementById('lightboxCaption');

        function openLightbox(src, caption) {
            lightboxImg.src = src;
            lightboxCaption.textContent = caption;
            lightboxModal.style.display = 'flex';
        }
        lightboxModal.addEventListener('click', () => {
            lightboxModal.style.display = 'none';
        });

        // Filter tabs
        document.querySelectorAll('.filter-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderGallery();
            });
        });

        // Search input
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            renderGallery();
        });

        // Save & Apply
        document.getElementById('btnSaveMapping').addEventListener('click', () => {
            localStorage.setItem('teacher_photo_mapping_v1', JSON.stringify(photoMapping));
            
            // Generate summary
            const assigned = [];
            for (const [fn, tid] of Object.entries(photoMapping)) {
                if (tid && tid !== '__skip__' && tid !== '__group__') {
                    const t = TEACHERS.find(x => x.id === tid);
                    if (t) assigned.push(`${fn} ➡️ ${t.name}`);
                }
            }
            alert(`Đã lưu thành công ${assigned.length} liên kết ảnh Thầy Cô vào bộ nhớ trình duyệt!\n\nBạn cũng có thể bấm "Xuất Danh Sách" để gửi danh sách cho trợ lý AI cập nhật mã nguồn nhé!`);
        });

        // Export Modal
        const exportModal = document.getElementById('exportModal');
        const exportTextarea = document.getElementById('exportTextarea');

        document.getElementById('btnExportList').addEventListener('click', () => {
            let text = "=== DANH SÁCH GÁN ẢNH THẦY CÔ ===\n\n";
            let count = 0;
            for (const [fn, tid] of Object.entries(photoMapping)) {
                if (tid) {
                    const t = TEACHERS.find(x => x.id === tid);
                    const name = t ? t.name : tid;
                    text += `${fn} -> ${name}\n`;
                    count++;
                }
            }
            if (count === 0) {
                text += "(Chưa có ảnh nào được gán Thầy Cô. Bạn hãy chọn Thầy/Cô từ dropdown dưới mỗi ảnh trước nhé!)\n";
            }
            exportTextarea.value = text;
            exportModal.style.display = 'flex';
        });

        document.getElementById('btnCloseExport').addEventListener('click', () => {
            exportModal.style.display = 'none';
        });

        document.getElementById('btnCopyExport').addEventListener('click', () => {
            exportTextarea.select();
            navigator.clipboard.writeText(exportTextarea.value);
            alert('Đã sao chép danh sách vào clipboard! Bạn hãy gửi lại vào khung chat để hoàn tất nhé!');
        });

        renderGallery();
    </script>
