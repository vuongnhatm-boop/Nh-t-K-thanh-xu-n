<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kéo Thả & Gán Ảnh Thầy Cô | Nhật Ký Thanh Xuân</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: rgba(148, 163, 184, 0.15);
            --primary: #f43f5e;
            --accent: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(244, 63, 94, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
        }

        /* HEADER */
        header.top-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand-title {
            font-size: 1.25em;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title span {
            color: var(--primary);
        }

        .stats-badge {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.82em;
            font-weight: 600;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.84em;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.35);
        }
        .btn-primary:hover:not(:disabled) {
            background: #e11d48;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--card-border);
        }
        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-undo {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .btn-undo:hover:not(:disabled) {
            background: rgba(245, 158, 11, 0.25);
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            background: #059669;
        }

        /* TEACHER DOCK (DRAGGABLE NAME CARDS) */
        .dock-container {
            position: sticky;
            top: 61px;
            z-index: 90;
            background: rgba(24, 33, 47, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(56, 189, 248, 0.2);
            padding: 10px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }

        .dock-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.82em;
            color: var(--text-muted);
            gap: 12px;
        }

        .dock-header strong {
            color: #38bdf8;
            font-size: 1.05em;
        }

        .dock-search-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dock-search {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: white;
            padding: 4px 10px;
            font-size: 0.82em;
            outline: none;
            width: 180px;
        }

        .dock-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            scroll-behavior: smooth;
        }

        .dock-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .dock-scroll::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 4px;
        }

        .teacher-chip {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: #1e293b;
            border: 1.5px solid var(--card-border);
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            color: #f1f5f9;
            cursor: grab;
            user-select: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .teacher-chip:hover {
            transform: translateY(-2px);
            border-color: #38bdf8;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
        }

        .teacher-chip:active {
            cursor: grabbing;
        }

        .teacher-chip.assigned {
            background: rgba(16, 185, 129, 0.12);
            border-color: rgba(16, 185, 129, 0.4);
            color: #a7f3d0;
        }

        .teacher-chip.selected-active {
            background: #38bdf8 !important;
            color: #0f172a !important;
            border-color: #38bdf8 !important;
            font-weight: 800;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.8);
        }

        .chip-dept-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* FILTER BAR */
        .filter-bar {
            max-width: 1400px;
            margin: 16px auto 0;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .filter-tabs {
            display: flex;
            gap: 6px;
            background: rgba(30, 41, 59, 0.6);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .filter-tab {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 6px 14px;
            border-radius: 7px;
            font-size: 0.82em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tab.active {
            background: var(--primary);
            color: white;
        }

        /* GALLERY GRID */
        .gallery-container {
            max-width: 1400px;
            margin: 16px auto 0;
            padding: 0 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        .photo-card {
            background: var(--card-bg);
            border: 2px dashed rgba(148, 163, 184, 0.25);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .photo-card:hover {
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .photo-card.drag-over {
            border-color: #38bdf8 !important;
            border-style: solid !important;
            background: rgba(56, 189, 248, 0.12) !important;
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        .photo-card.assigned {
            border-style: solid;
            border-color: rgba(16, 185, 129, 0.4);
            background: #182234;
        }

        .card-number-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--card-border);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.72em;
            font-weight: 700;
            color: #94a3b8;
            z-index: 10;
        }

        .card-img-wrap {
            width: 100%;
            height: 240px;
            position: relative;
            background: #090d16;
            cursor: pointer;
            overflow: hidden;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .card-img-wrap:hover img {
            transform: scale(1.04);
        }

        .card-zoom-hint {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.7em;
            color: #cbd5e1;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card-img-wrap:hover .card-zoom-hint {
            opacity: 1;
        }

        .card-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .filename-title {
            font-size: 0.86em;
            font-weight: 700;
            color: #f1f5f9;
            word-break: break-all;
        }

        .file-meta {
            font-size: 0.72em;
            color: var(--text-muted);
            display: flex;
            gap: 8px;
            margin-top: 2px;
        }

        .assigned-target-box {
            background: rgba(15, 23, 42, 0.7);
            border: 1.5px dashed rgba(56, 189, 248, 0.35);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            font-size: 0.8em;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .assigned-target-box.has-teacher {
            background: rgba(16, 185, 129, 0.15);
            border: 1.5px solid rgba(16, 185, 129, 0.5);
            justify-content: space-between;
            padding: 6px 10px;
        }

        .assigned-teacher-name {
            font-weight: 700;
            color: #34d399;
            text-align: left;
            line-height: 1.25;
        }

        .assigned-teacher-dept {
            font-size: 0.8em;
            color: #94a3b8;
            font-weight: 400;
        }

        .btn-unassign {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #fb7185;
            border-radius: 6px;
            padding: 3px 7px;
            font-size: 0.75em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-unassign:hover {
            background: rgba(244, 63, 94, 0.3);
            color: white;
        }

        .select-teacher {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 0.82em;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        .select-teacher:focus {
            border-color: #38bdf8;
        }

        /* TOAST */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.85em;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            animation: slideIn 0.2s ease-out;
            pointer-events: auto;
        }

        .toast.success {
            border-color: rgba(16, 185, 129, 0.6);
            color: #a7f3d0;
        }

        .toast.warning {
            border-color: rgba(245, 158, 11, 0.6);
            color: #fde68a;
        }

        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
    </style>
</head>

    <header class="top-header">
        <div class="brand-title">
            <span>🌸</span> Sắp Xếp & Kéo Thả Ảnh Thầy Cô

            </button>
            <button class="btn btn-secondary" id="btnExportList">
                📋 Xuất danh sách

            <a href="index.html" class="btn btn-success" target="_blank">

    </header>

    <!-- TEACHER BADGES DOCK (DRAGGABLE NAME CARDS) -->
    <div class="dock-container">
        <div class="dock-header">
            <div>
                <strong>🖐 Bảng Tên Thầy Cô (38 Thầy/Cô):</strong>
                <span>Kéo thả thẻ tên vào ảnh bên dưới, hoặc bấm vào tên rồi bấm vào ảnh!</span>
            </div>
            <div class="dock-search-wrap">
                <input type="text" class="dock-search" id="dockSearch" placeholder="🔍 Tìm tên Thầy/Cô...">
            </div>
        </div>
        <div class="dock-scroll" id="dockScroll">
            <!-- Populated via JS -->
        </div>
    </div>

    <!-- FILTER & SEARCH BAR -->
    <div class="filter-bar">
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">Tất Cả (48)</button>
            <button class="filter-tab" data-filter="unassigned">Chưa Gán</button>
            <button class="filter-tab" data-filter="assigned">Đã Gán</button>
        </div>
        <div style="font-size: 0.8em; color: var(--text-muted);">
            💡 Mẹo: Bấm vào ảnh để phóng to xem rõ mặt • Kéo thả hoặc chọn dropdown bên dưới mỗi ảnh
        </div>
    </div>

    <!-- GALLERY GRID -->
    <main class="gallery-container">
        <div class="gallery-grid" id="galleryGrid"></div>
    </main>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- LIGHTBOX MODAL -->
    <div class="modal-overlay" id="lightboxModal">
        <div style="max-width: 90vw; max-height: 90vh; text-align: center;">
            <img id="lightboxImg" src="" style="max-width: 100%; max-height: 80vh; border-radius: 12px; object-fit: contain; box-shadow: 0 10px 40px rgba(0,0,0,0.8);">
            <div id="lightboxCaption" style="margin-top: 10px; color: #cbd5e1; font-weight: 600;"></div>
        </div>
    </div>

    <!-- EXPORT MODAL -->
    <div class="modal-overlay" id="exportModal">
        <div style="background: var(--card-bg); border: 1px solid var(--card-border); padding: 24px; border-radius: 16px; width: 600px; max-width: 95vw;">
            <h3 style="margin-bottom: 12px; color: white;">📋 Danh Sách Ảnh Đã Gán</h3>
            <textarea id="exportTextarea" readonly style="width: 100%; height: 260px; background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; color: #a7f3d0; font-family: monospace; font-size: 0.85em; padding: 12px; outline: none;"></textarea>
            <div style="margin-top: 16px; display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn btn-secondary" id="btnCloseExport">Đóng</button>
                <button class="btn btn-primary" id="btnCopyExport">Sao Chép Danh Sách</button>
            </div>
        </div>
    </div>

        "cô Quỳnh Ht.JPG": "le-ngoc-quynh",
        "cô Đặng Mai.jpeg": "dang-thi-thanh-mai"
};

        // Current Mapping
        let photoMapping = { ...INITIAL_MAPPING };

        // Load existing mapping from localStorage if any
        try {
            const saved = localStorage.getItem('teacher_photo_mapping_v1');
            if (saved) {
                const parsed = JSON.parse(saved);
                photoMapping = { ...photoMapping, ...parsed };
            }
        } catch(e) {}

        // Undo & Redo History
        const undoStack = [];
        const redoStack = [];

        function pushHistory(filename, prevTid, newTid) {
            if (prevTid === newTid) return;
            undoStack.push({ filename, prevTid, newTid });
            redoStack.length = 0; // Clear redo on new action
            updateUndoRedoButtons();
        }

        function updateUndoRedoButtons() {
            const btnUndo = document.getElementById('btnUndo');
            const btnRedo = document.getElementById('btnRedo');
            if (btnUndo) btnUndo.disabled = undoStack.length === 0;
            if (btnRedo) btnRedo.disabled = redoStack.length === 0;
        }

        function undo() {
            if (undoStack.length === 0) return;
            const action = undoStack.pop();
            redoStack.push(action);
            photoMapping[action.filename] = action.prevTid;
            saveLocalAndSync();
            renderGallery();
            renderDock();
            updateUndoRedoButtons();
            showToast(`↩️ Đã hoàn tác ảnh ${action.filename}`, 'warning');
        }

        function redo() {
            if (redoStack.length === 0) return;
            const action = redoStack.pop();
            undoStack.push(action);
            photoMapping[action.filename] = action.newTid;
            saveLocalAndSync();
            renderGallery();
            renderDock();
            updateUndoRedoButtons();
            showToast(`↪️ Đã làm lại ảnh ${action.filename}`, 'success');
        }

        // Keyboard shortcut: Ctrl+Z and Ctrl+Y
        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                if (e.shiftKey) {
                    redo();
                } else {
                    undo();
                }
                e.preventDefault();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                redo();
                e.preventDefault();
            }
        });

        document.getElementById('btnUndo').addEventListener('click', undo);
        document.getElementById('btnRedo').addEventListener('click', redo);

        // Toast
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        // Currently selected teacher from dock for "click to assign"
        let selectedTeacherId = null;

        // Render Teacher Dock
        function renderDock() {
            const dockScroll = document.getElementById('dockScroll');
            const searchVal = (document.getElementById('dockSearch').value || '').toLowerCase();
            dockScroll.innerHTML = '';

            // Count usage
            const usageMap = {};
            for (const tid of Object.values(photoMapping)) {
                if (tid) usageMap[tid] = (usageMap[tid] || 0) + 1;
            }

            TEACHERS.forEach(t => {
                if (searchVal && !t.name.toLowerCase().includes(searchVal) && !(t.subject || '').toLowerCase().includes(searchVal)) {
                    return;
                }

                const count = usageMap[t.id] || 0;
                const chip = document.createElement('div');
                chip.className = 'teacher-chip' + (count > 0 ? ' assigned' : '') + (selectedTeacherId === t.id ? ' selected-active' : '');
                chip.draggable = true;
                chip.dataset.id = t.id;

                const deptColor = t.avatarColor || '#38bdf8';
                chip.innerHTML = `
                    <span class="chip-dept-dot" style="background: ${deptColor}"></span>
                    <span>${t.name}</span>
                    <span style="font-size: 0.8em; opacity: 0.75;">(${count})</span>
                `;

                // Drag start
                chip.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', t.id);
                    chip.style.opacity = '0.5';
                });
                chip.addEventListener('dragend', () => {
                    chip.style.opacity = '1';
                });

                // Click to select
                chip.addEventListener('click', () => {
                    if (selectedTeacherId === t.id) {
                        selectedTeacherId = null;
                        showToast(`Đã bỏ chọn ${t.name}`, 'warning');
                    } else {
                        selectedTeacherId = t.id;
                        showToast(`🖐 Đã chọn ${t.name}! Hãy bấm vào ảnh bạn muốn gán!`, 'success');
                    }
                    renderDock();
                });

                dockScroll.appendChild(chip);
            });
        }

        document.getElementById('dockSearch').addEventListener('input', renderDock);

        // Stats
        function updateStats() {
            const total = PHOTOS.length;
            const assignedCount = Object.values(photoMapping).filter(v => v && !v.startsWith('__')).length;
            const statsBadge = document.getElementById('statsBadge');
            if (statsBadge) {
                statsBadge.textContent = `${assignedCount}/${total} ảnh đã gán (${total - assignedCount} chưa gán)`;
            }
        }

        // Save local and optionally sync to backend
        async function saveLocalAndSync() {
            localStorage.setItem('teacher_photo_mapping_v1', JSON.stringify(photoMapping));
            updateStats();

            try {
                const res = await fetch('/api/save-mapping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mapping: photoMapping })
                });
                if (res.ok) {
                    const data = await res.json();
                    return data;
                }
            } catch(e) {
                // Ignore silent network errors on auto-save
            }
            return null;
        }

        // Gallery
        let currentFilter = 'all';

        function renderGallery() {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = '';

            const filtered = PHOTOS.filter(p => {
                const isAssigned = Boolean(photoMapping[p.filename]);
                if (currentFilter === 'assigned' && !isAssigned) return false;
                if (currentFilter === 'unassigned' && isAssigned) return false;
                return true;
            });

            filtered.forEach((p, idx) => {
                const assignedTeacherId = photoMapping[p.filename] || '';
                const assignedTeacher = TEACHERS.find(t => t.id === assignedTeacherId);

                const card = document.createElement('div');
                card.className = 'photo-card' + (assignedTeacherId ? ' assigned' : '');
                card.dataset.file = p.filename;

                // Options
                let optionsHtml = '<option value="">-- Chưa gán Thầy/Cô --</option>';
                optionsHtml += '<option value="__group__">Ảnh tập thể / Kỷ niệm chung</option>';
                optionsHtml += '<option value="__skip__">Bỏ qua / Không dùng</option>';
                optionsHtml += '<optgroup label="Danh Sách 38 Thầy Cô">';

                TEACHERS.forEach(t => {
                    const sel = (t.id === assignedTeacherId) ? 'selected' : '';
                    optionsHtml += `<option value="${t.id}" ${sel}>${t.name} (${t.subject || t.deptName})</option>`;
                });
                optionsHtml += '</optgroup>';

                let dropTargetHtml = '';
                if (assignedTeacher) {
                    dropTargetHtml = `
                        <div class="assigned-target-box has-teacher">
                            <div>
                                <div class="assigned-teacher-name">✓ ${assignedTeacher.name}</div>
                                <div class="assigned-teacher-dept">${assignedTeacher.subject || assignedTeacher.deptName}</div>
                            </div>
                            <button class="btn-unassign" data-file="${p.filename}">✕ Bỏ</button>
                        </div>
                    `;
                } else if (assignedTeacherId === '__group__') {
                    dropTargetHtml = `
                        <div class="assigned-target-box has-teacher" style="border-color: #38bdf8;">
                            <div class="assigned-teacher-name" style="color: #38bdf8;">✓ Ảnh Tập Thể Chung</div>
                            <button class="btn-unassign" data-file="${p.filename}">✕ Bỏ</button>
                        </div>
                    `;
                } else {
                    dropTargetHtml = `
                        <div class="assigned-target-box">
                            <span style="color: var(--text-muted);">🖐 Kéo thả Thầy/Cô vào đây</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="card-number-badge">#${idx + 1}</div>
                    <div class="card-img-wrap" data-src="${p.path}" data-name="${p.filename}">
                        <img src="${p.path}" alt="${p.filename}" loading="lazy">
                        <span class="card-zoom-hint">🔍 Phóng to</span>
                    </div>
                    <div class="card-body">
                        <div>
                            <div class="filename-title">${p.filename}</div>
                            <div class="file-meta">
                                <span>${p.width} × ${p.height} px</span>
                                <span>${p.size_kb} KB</span>
                            </div>
                        </div>

                        ${dropTargetHtml}

                        <div class="assign-select-wrap">
                            <select class="select-teacher" data-file="${p.filename}">
                                ${optionsHtml}
                            </select>
                        </div>
                    </div>
                `;

                // Drag and drop onto card
                card.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    card.classList.add('drag-over');
                });
                card.addEventListener('dragleave', () => {
                    card.classList.remove('drag-over');
                });
                card.addEventListener('drop', (e) => {
                    e.preventDefault();
                    card.classList.remove('drag-over');
                    const tid = e.dataTransfer.getData('text/plain');
                    if (tid) {
                        const prevTid = photoMapping[p.filename] || '';
                        pushHistory(p.filename, prevTid, tid);
                        photoMapping[p.filename] = tid;
                        saveLocalAndSync();
                        renderGallery();
                        renderDock();
                        const t = TEACHERS.find(x => x.id === tid);
                        showToast(`✅ Đã gán ${t ? t.name : tid} vào ${p.filename}`, 'success');
                    }
                });

                // Click card when a teacher is selected
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.card-img-wrap') || e.target.closest('.select-teacher') || e.target.closest('.btn-unassign')) {
                        return;
                    }
                    if (selectedTeacherId) {
                        const prevTid = photoMapping[p.filename] || '';
                        pushHistory(p.filename, prevTid, selectedTeacherId);
                        photoMapping[p.filename] = selectedTeacherId;
                        const t = TEACHERS.find(x => x.id === selectedTeacherId);
                        selectedTeacherId = null;
                        saveLocalAndSync();
                        renderGallery();
                        renderDock();
                        showToast(`✅ Đã gán ${t ? t.name : selectedTeacherId} vào ${p.filename}`, 'success');
                    }
                });

                // Unassign button
                const btnUnassign = card.querySelector('.btn-unassign');
                if (btnUnassign) {
                    btnUnassign.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const prevTid = photoMapping[p.filename] || '';
                        pushHistory(p.filename, prevTid, '');
                        delete photoMapping[p.filename];
                        saveLocalAndSync();
                        renderGallery();
                        renderDock();
                        showToast(`Đã hủy gán ảnh ${p.filename}`, 'warning');
                    });
                }

                // Dropdown change
                const selEl = card.querySelector('.select-teacher');
                selEl.addEventListener('change', (e) => {
                    const val = e.target.value;
                    const prevTid = photoMapping[p.filename] || '';
                    pushHistory(p.filename, prevTid, val);
                    photoMapping[p.filename] = val;
                    saveLocalAndSync();
                    renderGallery();
                    renderDock();
                });

                // Lightbox
                const imgWrap = card.querySelector('.card-img-wrap');
                imgWrap.addEventListener('click', () => {
                    openLightbox(p.path, `${p.filename} (${p.width}×${p.height} px)`);
                });

                galleryGrid.appendChild(card);
            });

            updateStats();
        }

        // Filter tabs
        document.querySelectorAll('.filter-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderGallery();
            });
        });

        // Lightbox
        const lightboxModal = document.getElementById('lightboxModal');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxCaption = document.getElementById('lightboxCaption');

        function openLightbox(src, caption) {
            lightboxImg.src = src;
            lightboxCaption.textContent = caption;
            lightboxModal.style.display = 'flex';
        }
        lightboxModal.addEventListener('click', () => {
            lightboxModal.style.display = 'none';
        });

        // Manual Save Button
        document.getElementById('btnSaveMapping').addEventListener('click', async () => {
            const result = await saveLocalAndSync();
            if (result && result.success) {
                showToast(`🎉 ${result.message}`, 'success');
            } else {
                showToast('✅ Đã lưu vào bộ nhớ trình duyệt thành công!', 'success');
            }
        });

        // Export Modal
        const exportModal = document.getElementById('exportModal');
        const exportTextarea = document.getElementById('exportTextarea');

        document.getElementById('btnExportList').addEventListener('click', () => {
            let text = "=== DANH SÁCH GÁN ẢNH THẦY CÔ ===\n\n";
            let count = 0;
            for (const [fn, tid] of Object.entries(photoMapping)) {
                if (tid) {
                    const t = TEACHERS.find(x => x.id === tid);
                    const name = t ? t.name : tid;
                    text += `${fn} -> ${name}\n`;
                    count++;
                }
            }
            exportTextarea.value = text;
            exportModal.style.display = 'flex';
        });

        document.getElementById('btnCloseExport').addEventListener('click', () => {
            exportModal.style.display = 'none';
        });

        document.getElementById('btnCopyExport').addEventListener('click', () => {
            exportTextarea.select();
            navigator.clipboard.writeText(exportTextarea.value);
            showToast('📋 Đã sao chép danh sách vào clipboard!', 'success');
        });

        // Initial render
        renderDock();
        renderGallery();
        updateStats();
        saveLocalAndSync();
    </script>
</body>
</html>
